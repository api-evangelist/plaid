    TelephoneNumberPurpose:
      title: Telephone Number Purpose
      description: 'Purpose of the phone number: HOME, BUSINESS, PERSONAL, FAX, or BOTH.

        BOTH indicates number is used for both HOME and BUSINESS purposes.

        `CELL` value is deprecated in v6.3, replaced by the `CELLULAR` value in the `network` field

        '
      type: string
      enum:
      - BOTH
      - BUSINESS
      - CELL
      - FAX
      - HOME
      - PERSONAL
    AccountHolder:
      title: Account Holder entity
      description: 'A customer''s relationship to a given account, extending their base customer information.


        Mark business holders by setting `type` or `relationship` to `BUSINESS`, with the legal entity name on `businessCustomer`. Unmarked holders are treated as individuals and must supply `name.first` and `name.last`.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/CustomerWithoutId'
      - type: object
        properties:
          relationship:
            $ref: '#/components/schemas/AccountHolderRelationship'
            description: 'Customer''s relationship to the account

              '
    BusinessOrConsumer:
      title: Business or Consumer Type
      description: 'Indicates whether the customer is a consumer (individual) or a business entity

        '
      type: string
      enum:
      - BUSINESS
      - CONSUMER
    DeliveryAddressType:
      title: Delivery Address Type
      description: 'The location type of an address

        '
      type: string
      enum:
      - BUSINESS
      - DELIVERY
      - HOME
      - MAILING
    CustomerWithoutId:
      title: Customer entity
      description: 'Represents a customer. Plaid-specific schema created to exclude the `customerId` property of the FDX `Customer` schema

        '
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BusinessOrConsumer'
          description: 'Whether this customer is a consumer (individual) or a business customer

            '
        name:
          $ref: '#/components/schemas/CustomerName'
        businessCustomer:
          $ref: '#/components/schemas/BusinessCustomer'
          description: 'When customer `type` is `BUSINESS`, business-specific customer information, such as business name

            '
    DeliveryAddress:
      title: Delivery Address
      description: 'A delivery address and its location type

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/Address'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/DeliveryAddressType'
            description: Type of address location. One of BUSINESS, DELIVERY, HOME, MAILING
          primary:
            type: boolean
            description: Whether this is the primary and first address to use for contact
    BusinessCustomer:
      title: Business Customer entity
      description: 'When the account holder is a business customer, provides business-specific customer information

        '
      type: object
      properties:
        name:
          type: string
          description: 'Name of the business customer

            '
    Address:
      title: Address
      description: 'Postal address

        '
      type: object
      properties:
        line1:
          $ref: '#/components/schemas/String64'
          description: 'Address line 1

            '
        line2:
          $ref: '#/components/schemas/String64'
          description: 'Address line 2

            '
        line3:
          $ref: '#/components/schemas/String64'
          description: 'Address line 3

            '
        city:
          $ref: '#/components/schemas/String64'
          description: 'City

            '
        region:
          $ref: '#/components/schemas/String64'
          description: 'State or province

            '
        postalCode:
          type: string
          maxLength: 10
          description: 'Postal code

            '
        country:
          $ref: '#/components/schemas/Iso3166CountryCode'
          description: 'ISO 3166-1 alpha-2 code, upper case, for example `US` — three-letter codes, full names, and lower case are rejected. Plaid also checks against its own supported-country list, so a valid code can still fail.

            '
      required:
      - line1
      - city
      - country
  parameters:
    AccountIdPath:
      name: accountId
      in: path
      description: 'Account identifier, found in the `GET /accounts` endpoint response.

        Plaid expects the ID to be a different value from the account number

        '
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  securitySchemes:
    openIdConnect:
      type: openIdConnect
      description: 'This API uses an [OpenID Connect (OIDC) authentication flow](https://plaid.com/core-exchange/docs/authentication) and accepts the resulting [access token](https://plaid.com/core-exchange/docs/authentication) as a bearer token. For example, `curl -H ''Authorization: Bearer <ACCESS&#95;TOKEN>''`.

        '
      openIdConnectUrl: https://www.your-organization.com/.well-known/openid-configuration
    oauth2:
      type: oauth2
      description: 'This API uses an [OAuth 2.0 authorization code flow](https://plaid.com/core-exchange/docs/authentication/oauth-flow) and accepts the resulting access token as a bearer token. For example, `curl -H ''Authorization: Bearer <ACCESS&#95;TOKEN>''`.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://www.your-organization.com/authorize
          tokenUrl: https://www.your-organization.com/token
          scopes:
            Account: (optional) Read account data
            Customer: (optional) Read customer data
            Transactions: (optional) Read transaction data
