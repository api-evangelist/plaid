    DepositAccountDescriptor:
      description: 'A deposit account. For example, a checking, savings or money market account.

        Plaid consumes more detailed information for `CHECKING` and `SAVINGS` accounts.


        The `accountType` field for deposit accounts may be set to any of the following:


        - `CHECKING`: A deposit account held at a financial institution that allows withdrawals and deposits.

        - `SAVINGS`: An interest-bearing deposit account held at a bank or other financial institution.

        - `CD`: A certificate of deposit (CD) is a product offered by banks and credit unions that provides an interest rate premium in exchange for the customer agreeing to leave a lump-sum deposit untouched for a predetermined period of time.

        - `ESCROW`: A contractual arrangement in which a third party (the stakeholder or escrow agent) receives and disburses money or property for the primary transacting parties, with the disbursement dependent on conditions agreed to by the transacting parties.

        - `MONEYMARKET`: A deposit account that pays interest based on current interest rates in the money markets.

        - `HIGHINTERESTSAVINGSACCOUNT`: A savings account that offers a higher interest rate than a standard savings account.

        - `FIRSTHOMESAVINGSACCOUNT`: A tax-advantaged savings account for a first home purchase.

        - `OTHERDEPOSIT`: Use when none of the listed enums apply.


        **Consumption scope:**

        - **Balances**: Plaid returns balances for all deposit account types.

        - **Auth**: Plaid maps each account''s `accountType` to an internal subtype, and the mapping can vary by institution. By default, `CHECKING` and `SAVINGS` resolve to Auth-eligible subtypes (`checking`, `savings`, or `cash management`); other types require Plaid to enable Auth for your institution before they return Auth data.

        - **Transactions**: Plaid consumes transactions for deposit accounts that resolve to Plaid''s internal `depository` account type. By default this includes `CHECKING`, `SAVINGS`, `CD`, and `MONEYMARKET`, though the mapping can vary by institution. Accounts that don''t resolve to `depository` return balances only (no Auth, no transactions).

        '
      allOf:
      - $ref: '#/components/schemas/AccountDescriptor'
      - type: object
        properties:
          accountCategory:
            type: string
            example: DEPOSIT_ACCOUNT
            enum:
            - DEPOSIT_ACCOUNT
          accountType:
            $ref: '#/components/schemas/DepositAccountType'
        required:
        - accountType
        - accountCategory
    Timestamp:
      title: Timestamp
      description: 'ISO 8601 date-time in format `YYYY-MM-DDThh:mm:ss.nnn[Z|[+|-]hh:mm]` according to

        [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)


        Send UTC or a local time with its correct offset. Plaid doesn''t normalize timestamps, so a local time labeled `Z` is read as UTC.

        '
      type: string
      format: date-time
      example: '2021-07-15T14:46:41.375Z'
    FundingSource:
      title: Funding Source
      description: Accounts for customer's alternate funding sources from which FI can transfer funds to cover transactions if customer has overdraft protection from a consented account. In the order of which accounts will be attempted to transfer the coverage amount needed. Contains masked or truncated account number or nickname, account type and/or institution name for full clarity on an internal or external funding source
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/Identifier'
          description: Long-term persistent identity of the funding source account, not an account number. This identity must be unique to the owning institution
        accountNumberDisplay:
          type: string
          example: '4321'
          description: Funding source account's masked or truncated account number or its nickname for display to the customer
        accountType:
          type: string
          example: CHECKING
          description: FDX account type of the funding source account (e.g. `CHECKING`, `SAVINGS`)
        institutionName:
          type: string
          example: Plaid Bank
          description: The name of the institution holding the account
    DigitalWalletDescriptor:
      description: 'Information for a digital wallet account


        **Note:** Digital wallet accounts are discoverable-only. Plaid does not consume downstream data (balances, transactions, Auth) for digital wallet accounts.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/AccountDescriptor'
      - type: object
        properties:
          accountCategory:
            type: string
            example: DIGITAL_WALLET
            enum:
            - DIGITAL_WALLET
          accountType:
            $ref: '#/components/schemas/DigitalWalletType'
        required:
        - accountType
        - accountCategory
    LoanAccountDescriptor:
      description: 'A loan account. For example, mortgage, student loan or auto loan. Revolving debt, where the balance can be drawn on again after it is paid down, belongs under `LOC_ACCOUNT` instead.

        Plaid consumes more detailed information for `MORTGAGE` and `STUDENTLOAN` accounts.


        The `accountType` field for loan accounts may be set to any of the following:


        - `AUTOLOAN`: A type of loan used to finance a car purchase.

        - `HOMEEQUITYLOAN`: A type of loan in which the borrower uses the equity of his or her home as collateral.

        - `INSTALLMENT`: A type of agreement or contract involving a loan that is repaid over time with a set number of scheduled payments.

        - `LOAN`: The lending of money by one or more individuals, organizations, or other entities to other individuals, organizations etc. Use when none of the other loan enums apply.

        - `MILITARYLOAN`: A military loan.

        - `MORTGAGE`: A type of loan you can use to buy or refinance a home.

        - `PERSONALLOAN`: A type of debt that is not protected by a guarantor, or collateralized by a lien on specific assets of the borrower.

        - `SMBLOAN`: A small/medium business loan.

        - `STUDENTLOAN`: A type of loan designed to help students pay for post-secondary education and the associated fees, such as tuition, books and supplies, and living expenses.

        '
      allOf:
      - $ref: '#/components/schemas/AccountDescriptor'
      - type: object
        properties:
          accountCategory:
            type: string
            example: LOAN_ACCOUNT
            enum:
            - LOAN_ACCOUNT
          accountType:
            $ref: '#/components/schemas/LoanAccountType'
        required:
        - accountType
        - accountCategory
    AccountDescriptor:
      title: Account Descriptor entity
      description: 'This descriptor provides minimal information about the account for use in lightweight arrays

        '
      type: object
      discriminator:
        propertyName: accountCategory
      properties:
        accountCategory:
          $ref: '#/components/schemas/AccountCategory'
        accountId:
          description: 'Long-term persistent identity of the account, though not an account number.

            This identity must be unique within your organization.


            This value must never change, including when the account number changes, and must not be derived from an account number.

            '
          $ref: '#/components/schemas/Identifier'
        accountNumberDisplay:
          description: 'Account display number for the end user''s handle at the owning financial

            institution.

            Plaid expects that the last 4 digits of this masked number correspond to the last 4 digits of the account number.

            Send at most 4 letters or digits, for example `5820` — not `****5820` or `xxxx-5820`.

            '
          type: string
          example: '4321'
        productName:
          type: string
          example: Premier Account
          description: 'Marketed product name for this account. Used in UIs to assist in account selection

            '
        productId:
          $ref: '#/components/schemas/Identifier'
          description: Unique ID of the marketed product for this account
        nickname:
          description: 'Account nickname

            '
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - accountCategory
      - accountId
      - productName
      - status
      - currency
    PaginatedArray:
      title: Paginated Array
      description: 'Base class for results that may be paginated

        '
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageMetadata'
    AnnuityAccountType:
      description: 'The account type.

        Plaid consumes basic balance account information from the `accounts/{accountId}` endpoint for a subset of the possible account types described in the FDX specification.

        '
      type: string
      example: FIXEDANNUITY
      enum:
      - ANNUITY
      - FIXEDANNUITY
      - VARIABLEANNUITY
    AnnuityAccountDescriptor:
      description: 'An annuity account. For example, a fixed or variable annuity account.


        The `accountType` field for annuity accounts may be set to any of the following:


        - `ANNUITY`: A form of insurance or investment entitling the investor to a series of annual sums.

        - `FIXEDANNUITY`: A type of insurance contract that promises to pay the buyer a specific, guaranteed interest rate on their contributions to the account.

        - `VARIABLEANNUITY`: A type of insurance contract that promises to pay back the buyer based on the performance of an underlying portfolio of mutual funds selected by the buyer.


        **Note:** Annuity accounts are discoverable-only. Plaid does not consume downstream data (balances, transactions, Auth) for annuity accounts.

        '
      allOf:
      - $ref: '#/components/schemas/AccountDescriptor'
      - type: object
        properties:
          accountCategory:
            type: string
            example: ANNUITY_ACCOUNT
            enum:
            - ANNUITY_ACCOUNT
          accountType:
            $ref: '#/components/schemas/AnnuityAccountType'
        required:
        - accountType
        - accountCategory
    AccountWithDetails:
      title: Account With Details entity
      description: 'An account with full details.

        '
      type: object
      discriminator:
        propertyName: accountCategory
        mapping:
          DEPOSIT_ACCOUNT: '#/components/schemas/DepositAccount'
          INVESTMENT_ACCOUNT: '#/components/schemas/InvestmentAccount'
          LOAN_ACCOUNT: '#/components/schemas/LoanAccount'
          LOC_ACCOUNT: '#/components/schemas/LineOfCreditAccount'
      oneOf:
      - $ref: '#/components/schemas/DepositAccount'
      - $ref: '#/components/schemas/LoanAccount'
      - $ref: '#/components/schemas/LineOfCreditAccount'
      - $ref: '#/components/schemas/InvestmentAccount'
    ScheduledPaymentType:
      title: Scheduled Payment Type
      description: The type of a payment scheduled on the account
      type: string
      example: AUTOPAY
      enum:
      - AUTOPAY
      - ONE_TIME
      - REPEATING
    InsuranceAccountType:
      description: 'The account type.

        Plaid consumes basic balance account information from the `accounts/{accountId}` endpoint for a subset of the possible account types described in the FDX specification.

        '
      type: string
      example: WHOLELIFE
      enum:
      - LONGTERMDISABILITY
      - SHORTTERMDISABILITY
      - UNIVERSALLIFE
      - WHOLELIFE
    DateString:
      title: Date String
      description: 'ISO 8601 full-date in format ''YYYY-MM-DD'' according

        to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

        '
      type: string
      format: date
      maxLength: 10
      example: '2021-07-15'
    LineOfCreditAccount:
      type: object
      description: 'Full details of a line of credit account. The `accountType` field for line of credit accounts may be set to any of the [account types](#line-of-credit-account-types) listed below. This category covers revolving debt, where the balance can be drawn on again after it is paid down; non-revolving debt belongs under `LOAN_ACCOUNT`.


        Plaid consumes the following parameters returned by the `GET /accounts` endpoint:


        * `availableCredit` — required for every `accountType` except `CHARGE`.

        * `creditLine`

        * `currentBalance`


        Additionally, for the `CREDITCARD` accountType, Plaid consumes the previous information plus the following for its liabilities product:


        * `advancesApr`

        * `lastPaymentAmount`

        * `lastPaymentDate`

        * `lastStmtBalance`

        * `lastStmtDate`

        * `minimumPaymentAmount`

        * `nextPaymentDate`

        * `purchasesApr`

        Plaid expects a decimal amount with two places (to represent fractional values of the base currency) for all monetary amounts. For example, `"currentBalance": 192.00`

        '
      allOf:
      - $ref: '#/components/schemas/LineOfCreditAccountDescriptor'
      - type: object
        properties:
          creditLine:
            type: number
            example: 10000.0
            description: 'Credit limit

              '
          availableCredit:
            type: number
            example: 8302.73
            description: 'Available credit.


              Required for every line of credit `accountType` except `CHARGE`.

              '
          nextPaymentAmount:
            type: number
            example: 1832.11
            description: 'Amount of next payment.

              May differ from `minimumPaymentAmount` if the customer pays more than their minimum or out of cycle

              '
          nextPaymentDate:
            $ref: '#/components/schemas/DateString'
            description: 'Due date of next payment.

              May differ from the payment due date listed on the customer''s most recent statement if the customer pays out of cycle


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          principalBalance:
            type: number
            example: 132.28
            description: 'Principal balance

              '
          currentBalance:
            type: number
            example: 1722.81
            description: 'Current balance of line of credit

              '
          minimumPaymentAmount:
            type: number
            example: 190.32
            description: 'Minimum payment amount from last statement balance,

              which is due at the payment due date listed on that statement

              '
          lastPaymentAmount:
            type: number
            example: 2852.91
            description: 'Amount of last payment

              '
          lastPaymentDate:
            $ref: '#/components/schemas/DateString'
            description: 'Last payment date


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          pastDueAmount:
            type: number
            example: 0
            description: 'Amount owed that the account holder failed to pay on the due date

              '
          lastStmtBalance:
            type: number
            example: 5393.81
            description: 'Final balance amount at end of last statement

              '
          lastStmtDate:
            $ref: '#/components/schemas/DateString'
            description: 'Last statement date


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          purchasesApr:
            type: number
            example: 0
            description: 'Annual percentage rate for purchases

              '
          advancesApr:
            type: number
            example: 0
            description: 'Annual percentage rate for cash advances

              '
          transfersApr:
            type: number
            example: 0
            description: Annual Percentage Rate for balance transfers
          bills:
            type: array
            description: Payments due on the account
            items:
              $ref: '#/components/schemas/Bills'
          scheduledPayments:
            type: array
            description: Array of payments scheduled
            items:
              $ref: '#/components/schemas/ScheduledPayments'
          chargedInterest:
            $ref: '#/components/schemas/InterestRate'
            description: The periodic interest rate on the line of credit
          cashAdvanceBalance:
            type: number
            example: 0
            description: Total balance of cash advances
          transferBalance:
            type: number
            example: 0
            description: Total of all balance transfer amounts
          ppilBalance:
            type: number
            example: 0
            description: Total balance of Post Purchase Installment Loans (PPIL)
          underArbitration:
            type: boolean
            example: false
            description: If `true`, the account is currently under arbitration
          feeSchedule:
            type: string
            example: Fees can range from 2.59% to 2.99%, plus 49 cents.
            description: Describes the current fee schedule for the account
          ppilApr:
            type: number
            example: 0
