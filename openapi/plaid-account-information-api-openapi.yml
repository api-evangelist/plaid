openapi: 3.2.0
info:
  title: Plaid Account Information API
  version: 6.4.0
  contact:
    name: Plaid support
    url: https://plaid.com/data-connectivity-core-exchange/
    email: dataconnectivity@plaid.com
  description: 'Operations tagged Account Information across 2 of this provider''s published API definitions: plaid-core-exchange-openapi-original.yml, plaid-core-exchange-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.your-organization.com/fdx/v6
  description: Financial Data Exchange V6.4.0 Core API
tags:
- name: Account Information
  description: Search and view customer accounts
paths:
  /accounts:
    get:
      operationId: searchForAccounts
      tags:
      - Account Information
      summary: List all accounts
      description: Search and view customer accounts.
      security:
      - openIdConnect:
        - Account
      - oauth2:
        - Account
      parameters:
      - $ref: '#/components/parameters/OffsetQuery'
      - $ref: '#/components/parameters/PageKeyQuery'
      - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: 'An array of accounts. May include accounts of any of the following types: [deposit](#deposit-account), [investment](#investment-account), [line of credit](#line-of-credit-account), [loan](#loan-account)


            **Note:** Each object in the accounts array is expected to contain at least one account type.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts'
              example:
                page:
                  nextOffset: B47D80MVP23T
                accounts:
                - accountCategory: DEPOSIT_ACCOUNT
                  accountId: depositAccount0000001
                  accountType: CHECKING
                  accountNumberDisplay: '5820'
                  productName: Checking
                  nickname: Main Checking
                  status: OPEN
                  currency:
                    currencyCode: USD
                - accountCategory: LOAN_ACCOUNT
                  accountId: loanAccount0000001
                  accountType: LOAN
                  accountNumberDisplay: '4704'
                  productName: Loan
                  nickname: Primary Loan
                  status: OPEN
                  currency:
                    currencyCode: USD
                - accountCategory: LOC_ACCOUNT
                  accountId: locAccount0000001
                  accountType: LINEOFCREDIT
                  accountNumberDisplay: '8200'
                  productName: Line of Credit
                  nickname: First Plaidypus LOC
                  status: OPEN
                  currency:
                    currencyCode: USD
                - accountCategory: INVESTMENT_ACCOUNT
                  accountId: investmentAccount0000001
                  accountType: TAXABLE
                  accountNumberDisplay: '1050'
                  productName: Brokerage Account
                  nickname: First Plaidypus Brokerage
                  status: OPEN
                  currency:
                    currencyCode: USD
    servers:
    - url: https://api.your-organization.com/fdx/v6
      description: Financial Data Exchange V6.4.0 Core API
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
      - Account Information
      summary: Get detailed information for a specific account
      description: 'Get account balances, liabilities, and other information. Plaid calls this endpoint for deposit, investment, loan, and line of credit accounts. Plaid uses this endpoint to get balances for deposit accounts, get liabilities for `STUDENTLOAN`, `MORTGAGE`, and `CREDITCARD` loan accounts, and get balances and holdings for investment accounts.


        See Plaid Balance API, Plaid Liabilities API, and Plaid Investments API for more information on how Plaid uses this information.


        **Note:** Plaid does not call `/accounts/{accountId}` for annuity accounts, commercial accounts, digital wallet accounts, or insurance accounts. These account categories are discoverable-only. The accounts appear in `GET /accounts`, but Plaid does not consume downstream data (balances, transactions, Auth) for these categories.'
      security:
      - openIdConnect:
        - Account
      - oauth2:
        - Account
      parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: 'The full details of an investment, loan, deposit, or line of credit account

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWithDetails'
    servers:
    - url: https://api.your-organization.com/fdx/v6
      description: Financial Data Exchange V6.4.0 Core API
components:
  schemas:
    Bills:
      title: Bills entity
      description: Statements of payments due for an account
      type: object
      properties:
        totalPaymentDue:
          type: number
          example: 190.32
          description: Total payment due or next payment due as it appears on the account statement. Monthly payment due for loans. May be the same amount as the `statementBalance`
        minimumPaymentDue:
          type: number
          example: 35.0
          description: The minimum amount which is due on the account statement
        dueDate:
          $ref: '#/components/schemas/DateString'
          description: The date that the payment is due as indicated on the statement
        autoPayEnabled:
          type: boolean
          example: false
          description: Whether the user's bill is paid automatically as indicated on the statement
        autoPayAmount:
          type: number
          example: 190.32
          description: The amount of money the user has set to autopay this bill as indicated on the statement
        autoPayDate:
          $ref: '#/components/schemas/DateString'
          description: The date the autopayment is set to trigger for this bill as indicated on the statement
        pastDueAmount:
          type: number
          example: 0
          description: The amount that the user should have already paid as it appears on the statement. The value is negative if the user owes money
        lastPaymentAmount:
          type: number
          example: 190.32
          description: The amount of the most recent payment as indicated on the statement
        lastPaymentDate:
          $ref: '#/components/schemas/DateString'
          description: The date of most recent payment as indicated on the statement
        statementBalance:
          type: number
          example: 5393.81
          description: The amount of the last statement. The value is negative if the user owes money
        statementDate:
          $ref: '#/components/schemas/DateString'
          description: The date the statement was issued
    InsuranceAccountDescriptor:
      description: 'An insurance account. For example, whole life insurance or short-term disability.


        The `accountType` field for insurance accounts may be set to any of the following:


        - `LONGTERMDISABILITY`: Insurance that replaces a portion of the policyholder''s income due to a disability for an extended period of time, usually more than a year.

        - `SHORTTERMDISABILITY`: Insurance that replaces a portion of the policyholder''s income due to a disability for a short period of time, usually less than a year.

        - `UNIVERSALLIFE`: A type of a cash value life insurance where the excess of premium payments above the current cost of insurance is credited to the cash value of the policy, which in turn is credited each month with interest.

        - `WHOLELIFE`: Life insurance which is guaranteed to remain in force for the insured''s entire lifetime, provided required premiums are paid, or to the maturity date.


        **Note:** Insurance accounts are discoverable-only. Plaid does not consume downstream data (balances, transactions, Auth) for insurance accounts.

        '
      allOf:
      - $ref: '#/components/schemas/AccountDescriptor'
      - type: object
        properties:
          accountCategory:
            type: string
            example: INSURANCE_ACCOUNT
            enum:
            - INSURANCE_ACCOUNT
          accountType:
            $ref: '#/components/schemas/InsuranceAccountType'
        required:
        - accountType
        - accountCategory
    PageMetadata:
      title: Page Metadata
      description: 'Contains the opaque identifier, `nextPageKey`, to indicate a paginated result set.

        The `nextOffset` identifier is deprecated and will be removed with a future major release.

        '
      type: object
      properties:
        nextOffset:
          type: string
          example: B47D80MVP23T
          deprecated: true
          description: 'Opaque identifier. Does not need to be numeric or have any specific pattern.

            Deprecated in favor of `nextPageKey`, will be removed with a future major release

            '
        nextPageKey:
          type: string
          example: B47D80MVP23T
          description: 'Opaque identifier. Does not need to be numeric or have any specific pattern.

            Implementation specific

            '
        totalElements:
          type: integer
          example: 3
          description: 'Total number of elements

            '
    SecurityId:
      title: Security ID entity
      description: 'Unique identifier for a security

        '
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        idType:
          $ref: '#/components/schemas/SecurityIdType'
    LoanAccountType:
      description: 'The account type.

        Plaid consumes basic balance account information from the `accounts/{accountId}` endpoint for a subset of the possible account types described in the FDX specification.

        '
      type: string
      example: HOMEEQUITYLOAN
      enum:
      - AUTOLOAN
      - HOMEEQUITYLOAN
      - INSTALLMENT
      - LOAN
      - MILITARYLOAN
      - MORTGAGE
      - PERSONALLOAN
      - SMBLOAN
      - STUDENTLOAN
    DepositAccount:
      title: Deposit Account Details entity
      description: 'Full details of a deposit account. Plaid consumes the same information for all types of deposit accounts.

        Plaid expects a decimal amount with two places (to represent fractional values of the base currency) for all monetary amounts. For example, `"currentBalance": 192.00`.


        The `accountType` field for deposit accounts may be set to any of the [account types](#deposit-account-types) listed below.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/DepositAccountDescriptor'
      - type: object
        properties:
          currentBalance:
            type: number
            example: 1399.02
            description: 'The total amount of money in the account (sum of all posted/cleared transactions, not including pending transactions).

              For Plaid''s full definition, see the [Transactions](https://plaid.com/docs/api/products/transactions/#transactions-get-response-accounts-balances-current)

              '
          availableBalance:
            type: number
            example: 1399.02
            description: 'The money in the account available to spend (sum of all transactions, plus or minus pending transactions).

              For Plaid''s full definition, see [Transactions](https://plaid.com/docs/api/products/transactions/#transactions-get-response-accounts-balances-available)

              '
          earnedInterest:
            $ref: '#/components/schemas/InterestRate'
            description: The periodic (usually monthly) interest rate earned on account balances
          underArbitration:
            type: boolean
            example: false
            description: If `true`, the account is currently under arbitration
          overdraftOptIn:
            type: boolean
            example: false
            description: Whether customer has opted-in to coverage for FI to allow transactions which overdraw their account balance due to a debit card payment or ATM withdrawal
          overdrafted:
            type: boolean
            example: false
            description: Whether account currently has a negative or overdrafted account balance
          overdraftProtectionFunded:
            type: boolean
            example: false
            description: Whether customer has arranged alternate funding source(s) for FI to authorize and pay transactions on their account which might otherwise be declined or cause an overdraft on the account
          overdraftFundingSources:
            type: array
            description: List of the customer's alternate funding sources from which FI can transfer funds to cover transactions if customer has overdraft protection from a consented account. In the order of which accounts will be attempted to transfer the coverage amount needed
            items:
              $ref: '#/components/schemas/FundingSource'
        required:
        - currentBalance
        - availableBalance
    CompoundingPeriod:
      title: Compounding Period
      description: Interest compounding Period
      type: string
      example: MONTHLY
      enum:
      - ANNUALLY
      - BIWEEKLY
      - DAILY
      - MONTHLY
      - SEMIANNUALLY
      - SEMIMONTHLY
      - WEEKLY
    LineOfCreditAccountType:
      description: 'The account type.

        Plaid consumes basic balance account information from the `accounts/{accountId}` endpoint for a subset of the possible account types described in the FDX specification.

        '
      type: string
      example: CREDITCARD
      enum:
      - LINEOFCREDIT
      - CHARGE
      - CREDITCARD
      - HOMELINEOFCREDIT
    SecurityIdType:
      title: Security ID Type
      description: 'Plaid consumes solely CUSIP, ISIN, and SEDOL.


        This field, along with `securityId` are **required** unless `symbol` is provided.


        **Note:** If `securityIdType` is provided, `securityId` is required.

        '
      type: string
      enum:
      - CINS
      - CMC
      - CME
      - CUSIP
      - ISIN
      - ITSA
      - NASDAQ
      - SEDOL
      - SICC
      - VALOR
      - WKN
    InvestmentAccount:
      description: 'Full details of an investment account. Plaid consumes all `InvestmentAccount` FDX fields for all types of investment accounts.

        In the holdings array, Plaid consumes fields depending on their relevancy to the holding type. See the `holdings` array for more information.

        Plaid expects a decimal amount with two places (to represent fractional values of the base currency) for all monetary amounts. For example, `"currentBalance": 192.00`

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/InvestmentAccountDescriptor'
      - type: object
        properties:
          availableCashBalance:
            type: number
            example: 3209.54
            description: 'Cash balance across all sub-accounts. Plaid expects that this includes sweep funds

              '
          earnedInterest:
            $ref: '#/components/schemas/InterestRate'
            description: The periodic (usually monthly) interest rate earned on account cash balances
          balanceAsOf:
            description: 'Date and time of the balance


              ISO 8601 date-time in format `YYYY-MM-DDThh:mm:ss.nnn[Z|[+|-]hh:mm]` according to

              [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)


              Send UTC or a local time with its correct offset. Plaid doesn''t normalize timestamps, so a local time labeled `Z` is read as UTC.

              '
            $ref: '#/components/schemas/Timestamp'
          currentValue:
            type: number
            example: 34938.2
            description: 'Total current value of all investments

              '
          holdings:
            type: array
            description: 'Holdings in the investment account.

              Plaid maps the `holding` and the `investmentAccount` FDX models to its securities models, which hold universal information like the ticker symbol, and to its holdings models, which hold account-specific information like balances. For more information, see [Plaid investments](https://plaid.com/docs/investments/#securities-and-holdings)

              '
            items:
              $ref: '#/components/schemas/Holding'
            example:
            - securityIds:
              - id: '123456789'
                idType: CUSIP
              holdingName: Apple Inc.
              holdingType: STOCK
              symbol: AAPL
              purchasedPrice: 150.0
              currentUnitPrice: 175.0
              currentUnitPriceDate: '2023-10-01'
              units: 1
              marketValue: 1750.0
              cashAccount: false
              currency:
                currencyCode: USD
              fiAttributes:
              - name: isCashEquivalent
                value: 'false'
        required:
        - availableCashBalance
        - currentValue
    Holding:
      title: Holding entity
      description: 'A holding in an investment account.

        Holdings in the investment account.

        Plaid maps the `holding` and the `investmentAccount` FDX models to its securities models, which hold universal information like the ticker symbol, and to its holdings models, which hold account-specific information like balances. For more information, see [Plaid investments](https://plaid.com/docs/investments/#securities-and-holdings)

        '
      allOf:
      - type: object
        properties:
          securityIds:
            description: 'Array of security identifiers


              Each entry must carry both `id` and `idType`. A holding whose entry has only one of the pair is rejected.

              '
            type: array
            items:
              $ref: '#/components/schemas/SecurityId'
          holdingName:
            type: string
            description: 'Holding name or security name


              Send a name specific to the security, whether or not you also send a ticker, CUSIP, ISIN, or SEDOL. Plaid treats this name as unique on its own, so a generic value such as `Money Market Fund` can collide with a same-named security from another institution and fail to resolve.


              When the security has none of those identifiers, this name is the only thing identifying it, so send the same string every time — with nothing else to match on, a change of spacing, casing, or punctuation reads as a different security and splits the holding''s history. When one of those identifiers is present it carries the identity instead, and the name can safely change.

              '
          holdingType:
            $ref: '#/components/schemas/HoldingType'
          holdingSubType:
            $ref: '#/components/schemas/HoldingSubType'
          symbol:
            type: string
            description: 'Ticker / Market symbol


              Every holding must carry at least one identifying value: this field, `securityIds`, or `holdingName`. A holding with none of them fails validation for the whole holdings response, not just that holding. For a security with no public identifier, send `holdingName` alone rather than putting a proprietary code in this field.

              '
          purchasedPrice:
            type: number
            description: 'Price of holding at the time of purchase.

              Plaid determines an approximate [cost basis](https://plaid.com/docs/api/products/investments/#investments-holdings-get-response-holdings-cost-basis)

              using the purchase price and the number of units. Plaid cannot take fees into account to determine the cost basis

              because the FDX holding schema doesn''t include fees.

              '
          currentUnitPrice:
            type: number
            description: 'Current unit price. Plaid uses this as the [`institution_price`](https://plaid.com/docs/api/products/investments/#investments-holdings-get-response-holdings-institution-price).

              Plaid falls back to using this as the [close price](https://plaid.com/docs/api/products/investments/#investments-holdings-get-response-securities-close-price)

              if you don''t return `securityIds` for holdings involving securities.

              '
          currentUnitPriceDate:
            $ref: '#/components/schemas/DateString'
            description: 'Current unit price as of date


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          units:
            type: number
            description: 'Plaid requires this field for holdings and transactions involving securities.

              For security-based actions other than stock splits, quantity.

              Shares for stocks, mutual funds, and others. Face value for bonds.

              Contracts for options.


              **Note:** This field is required if the transaction involves a security.

              '
          marketValue:
            type: number
            description: 'Market value at the time the data was retrieved

              '
          faceValue:
            type: number
            description: 'Required for bonds. Face value at the time the data was retrieved. If this isn''t present,

              Plaid assumes the holding isn''t a bond and falls back to `marketValue`.

              '
          cashAccount:
            type: boolean
            description: 'If true, indicates that this holding is used to maintain proceeds

              from sales, dividends, and other cash postings to the investment account.

              If you don''t set a value for `isCashEquivalent` in the `fiAttributes` array,

              then Plaid uses `cashAccount` in determining the [`is_cash_equivalent`](https://plaid.com/docs/api/products/investments/#investments-holdings-get-response-securities-is-cash-equivalent)

              status.


              Must agree with `holdingSubType`. If this field is `false` and `holdingSubType` is `CASH` or `MONEYMARKET`, the holding will be rejected.

              '
          currency:
            $ref: '#/components/schemas/Currency'
            description: 'Currency information if it is different from Account entity

              '
          fiAttributes:
            type: array
            description: 'Array of financial institution-specific attributes.

              Plaid recommends including a value for the `isCashEquivalent` attribute in this array, sent as a string value of `true` or `false`.

              This populates the [`is_cash_equivalent`](https://plaid.com/docs/api/products/investments/#investments-holdings-get-response-securities-is-cash-equivalent) field in Plaid''s customer-facing API.

              If you return a value for `isCashEquivalent`, then return the same value for `cashAccount` as a boolean.

              '
            items:
              $ref: '#/components/schemas/FiAttribute'
          taxLots:
            type: array
            description: 'Array of tax lots

              '
            items:
              $ref: '#/components/schemas/TaxLot'
        required:
        - cashAccount
        - marketValue
    HoldingSubType:
      title: Holding SubType
      description: 'The subtype of an investment holding. Set this to `CASH` or `MONEYMARKET` to indicate a cash-type holding, with `holdingType` set to `OTHER`.

        '
      type: string
      enum:
      - CASH
      - MONEYMARKET
    Identifier:
      title: Identifier
      description: 'Value for a unique identifier

        '
      type: string
      maxLength: 256
      example: someLongTermUniqueIDString
    InterestRate:
      title: Interest Rate entity
      description: Full description of a single interest rate
      type: object
      properties:
        rate:
          type: number
          example: 5.25
          description: Current interest rate value
        rateAsOf:
          $ref: '#/components/schemas/DateString'
          description: Date of change to the current interest rate value
        compoundingPeriod:
          $ref: '#/components/schemas/CompoundingPeriod'
          description: One of `DAILY`, `WEEKLY`, `BIWEEKLY`, `SEMIMONTHLY`, `MONTHLY`, `SEMIANNUALLY`, `ANNUALLY`
        priorRate:
          type: number
          example: 4.75
          description: Prior interest rate value, if any, before change on AsOf date
        type:
          $ref: '#/components/schemas/InterestRateType'
          description: One of `FIXED`, `INDEXED` or `VARIABLE`
        index:
          type: string
          example: SOFR
          description: 'If an INDEXED rate, the name of the index to which the rate is tied: `EONIA`, `EURIBOR`, `EURREPO`, `FEFUND`, `LIBOR`, `PRIME`, `SOFR`, `SONIA`, etc.'
    LoanAccount:
      title: Loan Account entity
      type: object
      description: 'Full details of a loan account. The `accountType` field for loan accounts may be set to any of the [account types](#loan-account-types) listed below. Revolving debt, where the balance can be drawn on again after it is paid down, belongs under `LOC_ACCOUNT` instead.


        Plaid only consumes the `MORTGAGE` and `STUDENTLOAN` types for its [Liabilities API](https://plaid.com/docs/api/products/liabilities/). For other loan account types Plaid consumes account details and transactions.

        Plaid consumes all loan account information as returned in the `GET /accounts` endpoint, as well as the additional information listed below:


        Required for all loan accounts:

        * `principalBalance`

        * `interestRate`

        * `interestRateType`


        Plaid can exempt specific institutions and platforms from `interestRate` and `interestRateType`. To request this behavior, contact Plaid during your onboarding process. `principalBalance` is always required.


        Optional fields for `STUDENTLOAN` accounts:

        * `interestPaidYearToDate`

        * `lastPaymentAmount`

        * `lastPaymentDate`

        * `maturityDate`

        * `nextPaymentDate`

        * `originalPrincipal`

        * `originatingDate`


        Required for `MORTGAGE` accounts:

        * `accountNumber`


        Optional fields for `MORTGAGE` accounts:

        * `escrowBalance`

        * `interestPaidYearToDate`

        * `lastPaymentAmount`

        * `lastPaymentDate`

        * `loanTerm`

        * `maturityDate`

        * `nextPaymentAmount`

        * `nextPaymentDate`

        * `originalPrincipal`

        * `originatingDate`


        Plaid expects a decimal amount with two places (to represent fractional values of the base currency) for all monetary amounts. For example, `"escrowBalance": 192.00`

        '
      allOf:
      - $ref: '#/components/schemas/LoanAccountDescriptor'
      - type: object
        properties:
          accountNumber:
            type: string
            example: loanAccount0000001
            description: 'Full account number for the end user''s handle for the account at the owning institution


              For `accountType` `MORTGAGE`, at least one of this field or `accountNumberDisplay` is required; if both are sent, this one takes precedence.

              '
          principalBalance:
            type: number
            example: 580303.95
            description: 'Principal balance

              '
          escrowBalance:
            type: number
            example: 3400.61
            description: 'Escrow balance of loan

              '
          originalPrincipal:
            type: number
            example: 650400.0
            description: 'Original principal of loan

              '
          originatingDate:
            $ref: '#/components/schemas/DateString'
            description: 'Date loan originated


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          loanTerm:
            type: integer
            example: 360
            description: 'Term of loan in months

              '
          nextPaymentAmount:
            type: number
            example: 2483.12
            description: 'Amount of next payment.

              May differ from the scheduled payment amount if the customer pays more than required or out of cycle

              '
          nextPaymentDate:
            $ref: '#/components/schemas/DateString'
            description: 'Due date of next payment.

              May differ from the payment due date listed on the customer''s most recent statement if the customer pays out of cycle


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          lastPaymentAmount:
            type: number
            example: 2483.12
            description: 'Amount of last payment

              '
          lastPaymentDate:
            $ref: '#/components/schemas/DateString'
            description: 'Last payment date


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          maturityDate:
            $ref: '#/components/schemas/DateString'
            description: 'Maturity date


              ISO 8601 full-date in format ''YYYY-MM-DD'' according

              to [IETF RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)

              '
          interestPaidYearToDate:
            type: number
            example: 403.04
            description: 'Interest paid year to date

              '
          interestRate:
            type: number
            example: 6.99
            description: 'The interest rate for the account, expressed as a number between 0 and 100. For example, `4` represents 4.00%, and `7.99` represents 7.99%.

              '
          interestRateType:
            $ref: '#/components/schemas/InterestRateType'
          currentSchool:
            type: string
            example: University of California
            description: 'Current school the student loan is connected to

              '
          loanProviderName:
            type: string
            example: Great Lakes
            description: 'Name of the institution providing the loan

              '
          chargedInterest:
            $ref: '#/components/schemas/InterestRate'
            description: The periodic interest rate on the loan
          annualPercentageRate:
            type: number
            example: 6.99
            description: The Annual Percentage Rate on the loan
        required:
        - principalBalance
        - interestRate
        - interestRateType
    ScheduledPayments:
      title: Scheduled Payments entity
      description: The payments scheduled on the account
      type: object
      properties:
        amount:
          type: number
          example: 190.32
          description: Total payment due or next payment due. Monthly payment due for loans
        date:
          $ref: '#/components/schemas/DateString'
          description: The date that the payment is due
        type:
          $ref: '#/components/schemas/ScheduledPaymentType'
          description: Type of payment (`AUTOPAY`, `ONE_TIME`, `REPEATING`)
        payToPrincipal:
          type: boolean
          example: false
          description: Whether payment is applied to principal or not
    InvestmentAccountType:
      description: 'The account type.

        Plaid consumes basic balance account information from the `accounts/{accountId}` endpoint for a subset of the possible account types described in the FDX specification.

        '
