description: >-
  Plaid publishes three named pricing tiers on plaid.com/pricing (US & Canada
  edition): Pay as You Go, Growth, and Custom. The page does NOT list numeric
  per-call, per-account or per-month prices — every tier's price is stated as
  qualitative copy ("Standard Pricing", "Discounted product rates",
  "Volume-based pricing"). The page also lists which products are Included /
  Not included / Contact for pricing per tier. First 200 API calls are free
  under Limited Production access. Plaid's stated pricing models (from the FAQ)
  are one-time per connected account, subscription per connected account, and
  per-request.
