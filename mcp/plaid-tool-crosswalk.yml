description: >-
  Crosswalk binding every tool Plaid officially advertises on its two MCP
  servers to its backing operationId(s) in the public Plaid OpenAPI where such
  a backing operation exists. Plaid's Dashboard MCP tools are Dashboard-scoped
  (Link analytics, product usage, team listing, Item debugging) and are NOT
  fronted by any public REST endpoint — they are marked mcp_only. Two Sandbox
  MCP tools DO front real REST calls (get_sandbox_access_token wraps sandbox
  public-token creation + item exchange; simulate_webhook wraps the
  sandbox*FireWebhook family) and are bound accordingly. Plaid publishes no
  native GraphQL API. Confidence is high where the mapping is a documented 1:1
  wrap, medium where the tool composes multiple operations, and n/a for
  mcp_only tools with no REST equivalent.
surfaces:
  openapi:
    path: openapi/plaid-plaid-api-openapi.yml
    operations_total: 351
    gated: false
  graphql:
    endpoint: null
    note: Plaid publishes no native GraphQL API (graphql/plaid-schema.graphql is a conceptual SDL only).
    gated: n/a
  mcp:
    dashboard_url: https://api.dashboard.plaid.com/mcp/
    dashboard_gated: true
    dashboard_gated_note: requires Plaid Production access + OAuth token with mcp:dashboard scope
    sandbox_stdio: uvx mcp-server-plaid
    sandbox_gated: true
    sandbox_gated_note: requires Plaid Sandbox client_id + secret
crosswalk:
  # ---- Dashboard MCP server (remote, mcp:dashboard scope) ----
  - tool: plaid_debug_item
    category: dashboard-diagnostics
    rest: []
    binding: mcp_only
    confidence: high
    note: >-
      Diagnoses an Item using Dashboard-internal metadata (item logs, latest
      errors, Link session, institution health). There is no equivalent
      single-call public REST endpoint; the closest public operation is
      itemGet, but plaid_debug_item returns Dashboard-only signals.
  - tool: plaid_get_link_analytics
    category: dashboard-analytics
    rest: []
    binding: mcp_only
    confidence: high
    note: Link funnel + conversion metrics are Dashboard-only; no public REST equivalent.
  - tool: plaid_get_tools_introduction
    category: mcp-meta
    rest: []
    binding: mcp_only
    confidence: high
    note: Returns usage guidance for the Dashboard MCP tools; MCP-server metadata.
  - tool: plaid_get_usages
    category: dashboard-analytics
    rest: []
    binding: mcp_only
    confidence: high
    note: Product-usage / request-volume metrics are Dashboard-only.
  - tool: plaid_list_teams
    category: dashboard-admin
    rest: []
    binding: mcp_only
    confidence: high
    note: Lists teams the OAuth token can act on; Dashboard-only.
  # ---- Sandbox MCP server (local stdio, sandbox client_id + secret) ----
  - tool: search_documentation
    category: docs-search
    rest: []
    binding: mcp_only
    confidence: high
    note: Full-text search of plaid.com/docs (llms.txt index); no REST endpoint.
  - tool: get_mock_data_prompt
    category: dev-tooling
    rest: []
    binding: mcp_only
    confidence: high
    note: Returns a prompt template for generating mock financial data; local tool, no REST.
  - tool: get_sandbox_access_token
    category: sandbox-lifecycle
    rest:
      - sandboxPublicTokenCreate
      - itemPublicTokenExchange
    binding: composite
    confidence: high
    note: >-
      Wraps the documented Sandbox onboarding pair: create a public_token with
      /sandbox/public_token/create then exchange it via /item/public_token/exchange.
  - tool: simulate_webhook
    category: sandbox-lifecycle
    rest:
      - sandboxItemFireWebhook
      - sandboxUserFireWebhook
      - sandboxTransferFireWebhook
    binding: composite
    confidence: medium
    note: >-
      Fans out to the sandbox *FireWebhook family depending on the requested
      webhook_type; the exact operation is selected by the tool at runtime.
