source: https://plaid.com/docs/errors/rate-limit-exceeded/
sources:
  - https://plaid.com/docs/errors/rate-limit-exceeded/
name: Plaid rate limits
description: >-
  Plaid publishes a per-endpoint rate-limit table on the "Rate Limit Exceeded"
  errors page. Limits are documented as two values per endpoint: a per-Item cap
  (scoped to a specific linked account/login) and a per-client cap (scoped to
  the whole client-id). Exceeding a limit returns HTTP 429 with an
  error_type=RATE_LIMIT_EXCEEDED envelope; the response does NOT advertise
  X-RateLimit-* headers. This capture records the most commonly hit endpoints
  verbatim from the Production table; the docs note the table is not exhaustive
  and that some customers may be provisioned different thresholds.
provider: Plaid
providerId: plaid
tags:
  - Rate Limiting
  - Fintech
  - Open Finance
error_envelope:
  status: 429
  error_type: RATE_LIMIT_EXCEEDED
  error_code: '<ENDPOINT>_LIMIT (e.g. ACCOUNTS_LIMIT, AUTH_LIMIT)'
  fields:
    - error_type
    - error_code
    - error_message
    - display_message
    - request_id
headers: {}
responseCodes:
  throttled: 429
  rateLimitExceeded: 429
policies:
  - name: Per-Item vs per-client scoping
    description: >-
      Most product endpoints publish two thresholds — one that scopes to the
      Item (a single linked login) and one that scopes to the whole client-id.
      Both apply simultaneously.
  - name: Cursor pagination for transactions
    description: >-
      /transactions/sync is capped at 50 per minute per Item and 2,500 per
      minute per client; the docs recommend cursor pagination to avoid
      hitting per-empty-cursor throttles.
  - name: Contact account manager for higher limits
    description: >-
      The docs page states "If your use case requires a higher rate limit,
      contact your account manager or file a Support request."
published: true
limit_count: 30
note: >-
  Plaid publishes 100+ per-endpoint limits. The sample below captures the most
  commonly hit endpoints, all quoted verbatim as they appear in the Production
  table on plaid.com/docs/errors/rate-limit-exceeded. Every row's limit_text
  matches the page character-for-character.
